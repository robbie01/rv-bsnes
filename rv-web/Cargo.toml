[package]
name = "rv-web"
publish = false
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
rv = { path = ".." }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "console", "Performance"] }

anyhow.workspace = true
object.workspace = true
include_bytes_aligned.workspace = true
bumpalo.workspace = true

console_error_panic_hook = "0.1"
