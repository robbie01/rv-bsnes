[workspace]
resolver = "2"
members = [".", "rv-web"]

[package]
name = "rv"
publish = false
version = "0.0.0"
edition = "2024"
default-run = "rv"

[dependencies]
anyhow = "1"
object = { version = "0.38", default-features = false, features = ["read_core", "elf"] }
include_bytes_aligned = "0.2"
stable-vec = "0.4"
fnv = "1"
paste = "1"
bumpalo = "3.19"
wasm-encoder = "0.244"
cfg-if = "1"

[profile.dev]
opt-level = 1